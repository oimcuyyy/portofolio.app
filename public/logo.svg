<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <title>Muhammad Rochimuloh — Full-Stack Developer Logo</title>
  <!-- Dark Tech Canvas Background -->
  <rect width="256" height="256" rx="56" fill="#070b14"/>
  <rect x="2" y="2" width="252" height="252" rx="54" stroke="#10b981" stroke-opacity="0.25" stroke-width="3"/>

  <!-- Left Code Bracket < -->
  <path d="M 64 96 L 36 128 L 64 160" stroke="#10b981" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right Code Bracket > -->
  <path d="M 192 96 L 220 128 L 192 160" stroke="#10b981" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Software Engineering Monogram 'R' -->
  <!-- Main Vertical Stem -->
  <path d="M 96 76 L 96 180" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>

  <!-- Top Loop -->
  <path d="M 96 84 H 136 C 158 84 168 94 168 110 C 168 126 158 134 136 134 H 96" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Forward Slash Dynamic Leg -->
  <path d="M 132 134 L 168 180" stroke="#10b981" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Terminal Node -->
  <circle cx="128" cy="54" r="5" fill="#38bdf8"/>
</svg>
